  </div>
</div>

<div class="palette no-print" id="palette">
  <button class="palette-closebtn" id="closePalette">✕</button>
  <h3>Libreria turni</h3>
  <p class="hint">Trascina un'etichetta su una cella della griglia per assegnarla. Il testo è sempre nero; scegli il colore di sfondo da una tavolozza fissa, così puoi riusare lo stesso colore per turni della stessa categoria.</p>
  <div class="viewfilter" id="paletteFilterRow" style="margin:0 0 12px;"></div>
  <div class="paletteRow" id="paletteRow"></div>
  <div class="paletteAdd">
    <input type="text" id="newTurnoText" placeholder="Nuovo turno (es. Sala Pediatria)">
    <div class="swatchRow" id="newTurnoSwatches"></div>
    <div class="catCheckRow" id="newTurnoCats"></div>
    <button class="btn-primary" id="addTurnoBtn" style="background:var(--accent); color:#fff;">Aggiungi opzione</button>
  </div>
</div>

<div class="weeknav">
  <div class="navbtns no-print"><button class="btn-small" id="prevWeek">‹ Settimana prec.</button></div>
  <div class="range" id="weekRange">—</div>
  <div class="pubinfo" id="pubInfo">—</div>
  <button class="btn-small no-print" id="btnPublish">Pubblica settimana</button>
  <div class="navbtns no-print"><button class="btn-small" id="nextWeek">Settimana succ. ›</button></div>
</div>

<div class="viewfilter no-print" id="viewFilter"></div>

<div class="wrap" id="app"><div class="loading">Caricamento…</div></div>

</div>
